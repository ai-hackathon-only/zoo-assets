<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Zoo park testbed · zoo-assets</title>
  <meta name="description" content="A procedural toy zoo assembled in the browser from the zoo-assets GLB library.">
  <script type="importmap">
  { "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/" } }
  </script>
  <style>
    :root {
      --bg: #edf2ea; --surface: #ffffff; --border: #e6e3d8; --text: #1f2421;
      --text-muted: #6b7566; --primary: #2d5a27; --primary-dark: #1b3817; --accent: #d97736;
      --radius: 12px; --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .panel {
      position: fixed; top: 12px; left: 12px; width: 272px; max-height: calc(100% - 24px); overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: 0 4px 12px rgba(31, 36, 33, 0.08);
    }
    .panel header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
    a { color: var(--primary); }
    .back { font-size: 13px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    label output { float: right; font-weight: 400; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--primary); }
    input[type=text] {
      flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    button {
      font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--primary); background: var(--primary); color: #fff; cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    button.ghost { background: transparent; color: var(--primary); }
    button.ghost:hover { background: #ebf3e8; }
    .meta { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 12px 0 0; }
    .hud { font-variant-numeric: tabular-nums; }
    .mapbox {
      position: fixed; right: 12px; bottom: 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px; box-shadow: 0 4px 12px rgba(31, 36, 33, 0.08);
    }
    .mapbox p { margin: 0 0 6px; font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; gap: 8px; }
    #minimap { display: block; width: 240px; height: 240px; border-radius: var(--radius-sm); cursor: pointer; }
    #panel-toggle { display: none; }
    @media (max-width: 600px) {
      .panel { left: 8px; right: 8px; top: 8px; width: auto; max-height: 60%; padding: 10px 12px; }
      .panel header { margin-bottom: 8px; align-items: center; }
      .panel .row { margin-bottom: 0; }
      #panel-toggle { display: inline-block; padding: 6px 10px; font-size: 13px; }
      .panel.collapsed .panel-body { display: none; }
      .panel-body { margin-top: 8px; }
      input[type=text], select { font-size: 16px !important; }
      button { min-height: 40px; }
      input[type=range] { height: 28px; }
      #minimap { width: 120px; height: 120px; }
      .mapbox { right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); padding: 6px; }
      .mapbox p { font-size: 11px; }
      #overview { min-height: 28px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="3D view of the generated zoo"></canvas>
  <section class="panel" aria-label="Zoo settings">
    <header>
      <h1>Zoo park testbed</h1>
      <span><button id="panel-toggle" type="button" class="ghost" aria-expanded="false" aria-controls="panel-body">Settings</button>
      <a class="back" href="../">Gallery</a></span>
    </header>
    <div class="row">
      <input id="seed" type="text" inputmode="numeric" aria-label="Seed" title="Seed: same settings and seed give the same zoo">
      <button id="shuffle" type="button">Shuffle</button>
      <button id="theme" type="button" class="ghost" style="padding:6px 10px;font-size:13px" title="Toggle day / night lighting">🌙 Night</button>
    </div>
    <div class="panel-body" id="panel-body">
    <label for="style">Layout style</label>
    <select id="style" style="width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);margin-bottom:4px">
      <option value="grid">Grid (orthogonal avenues)</option>
      <option value="loop">Loop (ring thoroughfare)</option>
      <option value="radial">Radial (central plaza & spokes)</option>
    </select>
    <label for="size">Park size <output id="size-out"></output></label>
    <input id="size" type="range" min="80" max="600" step="10">
    <label for="density">Density <output id="density-out"></output></label>
    <input id="density" type="range" min="0" max="1" step="0.05">
    <label for="population">Visitors and keepers <output id="population-out"></output></label>
    <input id="population" type="range" min="0" max="300" step="5">
    <div class="row" style="margin:10px 0 0">
      <button id="sim-toggle" type="button" class="ghost" style="flex:1" title="Toggle NPC movement simulation">Pause NPCs</button>
      <button id="look-toggle" type="button" class="ghost" style="flex:1" aria-pressed="false" title="Toy / Sumi-e look">Look: Toy</button>
    </div>
    <div class="row" style="margin:8px 0 0">
      <button id="export" class="ghost" type="button" title="Download this zoo as layout.json">Export</button>
      <button id="import" class="ghost" type="button" title="Load a layout.json file">Import</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
    <p class="meta" id="stats">Loading…</p>
    <p class="meta hud"><span id="fps">–</span> · <span id="first">loading</span></p>
    </div>
  </section>
  <aside class="mapbox" aria-label="Park map">
    <p><span id="focus-name">Whole park</span><button id="overview" class="ghost" type="button" style="padding:2px 8px;font-size:12px">Overview</button></p>
    <canvas id="minimap" width="480" height="480" aria-label="Top-down map; click an enclosure to fly there"></canvas>
  </aside>
  <script>
    // Phones: settings start folded so the zoo is visible; the button opens them.
    (() => {
      const panel = document.querySelector('.panel');
      const btn = document.getElementById('panel-toggle');
      const set = (open) => { panel.classList.toggle('collapsed', !open); btn.setAttribute('aria-expanded', open); btn.textContent = open ? 'Hide' : 'Settings'; };
      set(!matchMedia('(max-width: 600px)').matches);
      btn.addEventListener('click', () => set(panel.classList.contains('collapsed')));
    })();
  </script>
  <script type="module" src="./park.js"></script>
</body>
</html>
